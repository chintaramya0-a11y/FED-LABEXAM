<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusPulse | College Event Management</title>
    <style>
        /* --- Root & Resets --- */
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #0f172a;
            --background: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --spacing: 1.5rem;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- Navigation Bar (Flexbox) --- */
        .navbar {
            background-color: var(--secondary);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .nav-logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .nav-logo span {
            color: #818cf8;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-links a:hover, .nav-links a.active {
            color: white;
        }

        .btn-nav {
            background-color: var(--primary);
            color: white !important;
            padding: 0.5rem 1.25rem;
            border-radius: 6px;
            transition: background 0.2s ease;
        }

        .btn-nav:hover {
            background-color: var(--primary-hover);
        }

        /* --- Main Content Structure --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing);
            width: 100%;
            flex: 1; /* Pushes footer to bottom */
        }

        /* --- Categories Section (Flexbox) --- */
        .categories-container {
            margin-bottom: 2.5rem;
        }

        .section-title {
            font-size: 1.75rem;
            color: var(--secondary);
            margin-bottom: 1.2rem;
            font-weight: 700;
        }

        .category-list {
            display: flex;
            gap: 0.75rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            list-style: none;
            scrollbar-width: thin;
        }

        .category-item {
            background-color: #e2e8f0;
            color: var(--text-main);
            padding: 0.5rem 1.25rem;
            border-radius: 20px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .category-item.active, .category-item:hover {
            background-color: var(--primary);
            color: white;
        }

        /* --- Events Display Section (CSS Grid) --- */
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--spacing);
            margin-bottom: 3rem;
        }

        .event-card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .event-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .event-img-wrapper {
            position: relative;
            width: 100%;
            height: 200px;
            background-color: #cbd5e1;
        }

        .event-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .event-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background-color: rgba(15, 23, 42, 0.85);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .event-content {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .event-title {
            font-size: 1.25rem;
            color: var(--secondary);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .event-details {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .event-btn {
            margin-top: auto; /* Aligns buttons dynamically at card bottom */
            background-color: var(--primary);
            color: white;
            text-align: center;
            padding: 0.75rem;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            text-decoration: none;
        }

        .event-btn:hover {
            background-color: var(--primary-hover);
        }

        /* --- Footer (Flexbox) --- */
        footer {
            background-color: var(--secondary);
            color: #94a3b8;
            padding: 2rem 5%;
            margin-top: auto;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 1.5rem;
            align-items: center;
        }

        .footer-info p {
            font-size: 0.9rem;
        }

        .footer-links {
            display: flex;
            gap: 1.5rem;
            list-style: none;
        }

        .footer-links a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: white;
        }

        /* --- Responsive Breakpoints (Media Queries) --- */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }

            .nav-links {
                gap: 1.25rem;
                font-size: 0.95rem;
            }

            .footer-content {
                flex-direction: column;
                text-align: center;
            }

            .footer-links {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-logo">Campus<span>Pulse</span></div>
        <ul class="nav-links">
            <li><a href="#" class="active">Events</a></li>
            <li><a href="#">Schedule</a></li>
            <li><a href="#">Clubs</a></li>
            <li><a href="#" class="btn-nav">Host Event</a></li>
        </ul>
    </nav>

    <!-- Main Content Container -->
    <main class="container">
        
        <!-- Categories Section -->
        <section class="categories-container">
            <h2 class="section-title">Browse Categories</h2>
            <ul class="category-list">
                <li class="category-item active">All Events</li>
                <li class="category-item">Technical</li>
                <li class="category-item">Cultural</li>
                <li class="category-item">Sports</li>
                <li class="category-item">Workshops</li>
                <li class="category-item">Seminars</li>
            </ul>
        </section>

        <!-- Upcoming Events Grid -->
        <section>
            <h2 class="section-title">Upcoming Events</h2>
            <div class="events-grid">
                
                <!-- Event Card 1 -->
                <article class="event-card">
                    <div class="event-img-wrapper">
                        <span class="event-badge">Technical</span>
                        <img src="https://unsplash.com" alt="Hackathon" class="event-img">
                    </div>
                    <div class="event-content">
                        <h3 class="event-title">Annual National Hackathon</h3>
                        <div class="event-details">
                            <div class="detail-item">📅 <strong>Date:</strong> Oct 24, 2026</div>
                            <div class="detail-item">📍 <strong>Venue:</strong> Main Seminar Hall, Block C</div>
                        </div>
                        <a href="#" class="event-btn">Register Now</a>
                    </div>
                </article>

                <!-- Event Card 2 -->
                <article class="event-card">
                    <div class="event-img-wrapper">
